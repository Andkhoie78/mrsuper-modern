services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-edustream}
      MYSQL_USER: ${DB_USER:-edustream}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h127.0.0.1 -P3306 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" -e \"SELECT 1\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports: ["127.0.0.1:8025:8025"]
  api:
    build: {context: ., dockerfile: api/Dockerfile}
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      PORT: 3200
      STORAGE_ROOT: /app/storage
      API_PUBLIC_ORIGIN: ""
      COOKIE_SECURE: "false"
      CORS_ORIGINS: "http://localhost:8090"
      FRONTEND_URL: "http://localhost:8090"
    volumes: [app_storage:/app/storage]
    depends_on:
      mysql: {condition: service_healthy}
  web:
    build: {context: ., dockerfile: frontend/Dockerfile}
    restart: unless-stopped
    ports: ["${WEB_PORT:-8090}:80"]
    depends_on: [api]
volumes:
  mysql_data:
  app_storage:
